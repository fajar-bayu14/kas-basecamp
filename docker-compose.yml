services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catatan-kas-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://kas_user:kas_password@db:3306/catatan_kas
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: catatan-kas-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: catatan_kas
      MYSQL_USER: kas_user
      MYSQL_PASSWORD: kas_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kas_user", "-pkas_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
    driver: local
